name: Build Dictionary Android 4.4

on:
  workflow_dispatch:
  push:
    branches: [android-4.4]
    paths:
      - 'legacy-android-4.4/**'
      - '.github/workflows/build-android-4.4.yml'

permissions:
  contents: write

concurrency:
  group: dictionary-android-4-4
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-4.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          java -version
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-33' 'build-tools;33.0.2' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p legacy-android-4.4 clean assembleRelease --stacktrace --info --warning-mode all --no-daemon 2>&1 | tee dictionary-build.log
      - name: Save and verify APK
        shell: bash
        run: |
          set -euo pipefail
          find legacy-android-4.4/app/build/outputs -maxdepth 6 -type f -print | sort | tee dictionary-output-files.log
          APK="$(find legacy-android-4.4/app/build/outputs/apk -type f -name '*release*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p apk
          cp "$APK" apk/dictionary-android-4.4.apk
          sha256sum apk/dictionary-android-4.4.apk | tee dictionary-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dictionary-android-4.4
          path: apk/dictionary-android-4.4.apk
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dictionary-android-4.4-diagnostics
          path: |
            dictionary-build.log
            dictionary-output-files.log
            dictionary-sha256.txt
          if-no-files-found: ignore
      - name: Commit APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add apk/dictionary-android-4.4.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Build Dictionary Android 4.4 APK'
            git pull --rebase origin android-4.4
            git push origin HEAD:android-4.4
          fi
