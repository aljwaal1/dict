name: Build Dictionary Android 4.4

on:
  workflow_dispatch:
  push:
    branches: [android-4.4]
    paths: ['legacy-android-4.4/**', 'assets/data/words.json', '.github/workflows/build-android-4.4.yml']

permissions:
  contents: write

concurrency:
  group: dictionary-android-4-4
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-4.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-33' 'build-tools;33.0.2' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Bundle complete offline dictionary
        run: |
          set -euo pipefail
          test "$(jq '.words | length' assets/data/words.json)" = "1350"
          test "$(jq '[.words[] | select(.word_en == "" or .meaning_ar == "" or (.grade | IN("KG", "1", "2", "3", "4", "5", "6", "7", "8") | not))] | length' assets/data/words.json)" = "0"
          mkdir -p legacy-android-4.4/app/src/main/assets
          cp assets/data/words.json legacy-android-4.4/app/src/main/assets/words.json
      - name: Lint native Android app
        run: gradle -p legacy-android-4.4 lintDebug --stacktrace --no-daemon
      - name: Build signed debug APK
        run: |
          set -o pipefail
          gradle -p legacy-android-4.4 clean assembleDebug --stacktrace --info --no-daemon 2>&1 | tee dictionary-build.log
      - name: Save and verify APK
        run: |
          set -euo pipefail
          APK="$(find legacy-android-4.4/app/build/outputs/apk -type f -name '*debug*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/33.0.2/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p apk
          cp "$APK" apk/dictionary-android-4.4.apk
          sha256sum apk/dictionary-android-4.4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dictionary-android-4.4
          path: apk/dictionary-android-4.4.apk
          if-no-files-found: error
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dictionary-android-4.4-build-log
          path: dictionary-build.log
          if-no-files-found: ignore
      - name: Commit APK
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add apk/dictionary-android-4.4.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Build signed Dictionary Android 4.4 APK'
            git pull --rebase origin android-4.4
            git push origin HEAD:android-4.4
          fi
