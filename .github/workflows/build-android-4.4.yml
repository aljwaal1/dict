name: Build Dictionary Android 4.4
on:
  workflow_dispatch:
  push:
    branches: [android-4.4]
    paths: ['legacy-android-4.4/**','.github/workflows/build-android-4.4.yml']
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        run: wget -q https://services.gradle.org/distributions/gradle-7.6-bin.zip && unzip -q gradle-7.6-bin.zip
      - name: Build APK
        working-directory: legacy-android-4.4
        run: ../gradle-7.6/bin/gradle assembleRelease --no-daemon
      - name: Save APK
        run: mkdir -p apk && cp legacy-android-4.4/app/build/outputs/apk/release/app-release.apk apk/dictionary-android-4.4.apk
      - name: Commit APK
        run: git config user.name github-actions && git config user.email actions@github.com && git add apk/dictionary-android-4.4.apk && git commit -m 'Build Dictionary Android 4.4 APK' || true && git push
