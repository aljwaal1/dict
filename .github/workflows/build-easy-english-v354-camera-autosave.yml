name: Build Easy English AI v3.5.5 Install Fix

on:
  push:
    branches: ["easy-english-ai-v354-camera-autosave"]
    paths-ignore:
      - "release/*.apk"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: easy-english-ai-v354-camera-autosave
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: easy-english-ai-v354-camera-autosave
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply camera autosave upgrade
        run: python3 tool/upgrade_easy_english_v354_camera_autosave.py
      - name: Verify source features
        shell: bash
        run: |
          grep -q "const appVersion = '3.5.5'" lib/main.dart
          grep -q "version: 3.5.5+40" pubspec.yaml
          grep -q "image_picker:" pubspec.yaml
          grep -q "google_mlkit_text_recognition:" pubspec.yaml
          grep -q "pickAndAnalyzeImages" lib/main.dart
          grep -q "ImageSource.camera" lib/main.dart
          grep -q "pickMultiImage" lib/main.dart
          grep -q "TextRecognizer" lib/main.dart
          grep -q "booklab_latest_draft" lib/main.dart
          grep -q "استعادة آخر عمل محفوظ" lib/main.dart
          grep -q "reading-pdf" lib/main.dart
          grep -q "ocr-camera" lib/main.dart
          grep -q "on-device-translation" lib/main.dart
          grep -q "recentMistakes" lib/main.dart
          grep -q "case 'smartmix':" lib/main.dart
          grep -q "document.dispose" lib/main.dart
      - name: Prepare Android
        shell: bash
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
          flutter create --platforms=android --org com.explapp .
          rm -rf test
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts || true
          sed -i 's/namespace = ".*"/namespace = "com.explapp.jordan_school_dictionary"/' android/app/build.gradle.kts || true
          sed -i 's/applicationId = ".*"/applicationId = "com.explapp.jordan_school_dictionary"/' android/app/build.gradle.kts || true
          sed -i 's/android:label="[^"]*"/android:label="Easy English AI"/' android/app/src/main/AndroidManifest.xml || true
          mkdir -p android/app/src/main/kotlin/com/explapp/jordan_school_dictionary
          cat > android/app/src/main/kotlin/com/explapp/jordan_school_dictionary/MainActivity.kt <<'EOF'
          package com.explapp.jordan_school_dictionary

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          EOF
          rm -rf android/app/src/main/kotlin/com/explapp/qamoosi_school
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
      - name: Verify APKs
        shell: bash
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/easy-english-ai-v3.5.5-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/easy-english-ai-v3.5.5-arm64-v8a.apk
          test -s release/easy-english-ai-v3.5.5-universal.apk
          test -s release/easy-english-ai-v3.5.5-arm64-v8a.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs release/easy-english-ai-v3.5.5-universal.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs release/easy-english-ai-v3.5.5-arm64-v8a.apk
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging release/easy-english-ai-v3.5.5-universal.apk | tee /tmp/universal-badging.txt
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging release/easy-english-ai-v3.5.5-arm64-v8a.apk | tee /tmp/arm64-badging.txt
          grep -q "package: name='com.explapp.jordan_school_dictionary'" /tmp/universal-badging.txt
          grep -q "package: name='com.explapp.jordan_school_dictionary'" /tmp/arm64-badging.txt
          grep -q "versionCode='40'" /tmp/universal-badging.txt
          grep -q "versionName='3.5.5'" /tmp/universal-badging.txt
          grep -q "native-code: 'arm64-v8a'" /tmp/arm64-badging.txt
          sha256sum release/easy-english-ai-v3.5.5-*.apk
      - name: Persist final source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart pubspec.yaml android/app/build.gradle.kts android/app/src/main/AndroidManifest.xml android/app/src/main/kotlin
          if ! git diff --cached --quiet; then
            git commit -m "Materialize Easy English AI Android v3.5.5 install fix"
            git push origin HEAD:easy-english-ai-v354-camera-autosave
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: easy-english-ai-v3.5.5-apks
          path: |
            release/easy-english-ai-v3.5.5-universal.apk
            release/easy-english-ai-v3.5.5-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="easy-english-ai-v3.5.5"
          FILE1="release/easy-english-ai-v3.5.5-arm64-v8a.apk"
          FILE2="release/easy-english-ai-v3.5.5-universal.apk"
          NOTES="Android v3.5.5 install-fix release: canonical package namespace, verified APK signatures and badging, ARM64 and universal builds, camera/gallery OCR, PDF processing, and progressive autosave."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE1" "$FILE2" --clobber
          else
            gh release create "$TAG" "$FILE1" "$FILE2" --target easy-english-ai-v354-camera-autosave --title "Easy English AI v3.5.5" --notes "$NOTES"
          fi
