name: Build Qamoosi AI Clean v3.4.1

on:
  push:
    branches: ["qamoosi-ai-clean-v341"]
    paths-ignore:
      - "release/*.apk"
  pull_request:
    branches: ["qamoosi-ai-clean-v341"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qamoosi-clean-v341-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4
        with:
          ref: qamoosi-ai-clean-v341
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android
        shell: bash
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
          flutter create --platforms=android --org com.explapp .
          rm -rf test
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts || true
          sed -i 's/applicationId = ".*"/applicationId = "com.explapp.jordan_school_dictionary"/' android/app/build.gradle.kts || true
          sed -i 's/android:label="[^"]*"/android:label="قاموسي AI"/' android/app/src/main/AndroidManifest.xml || true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze clean source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Universal APK directly
        run: flutter build apk --release

      - name: Stage Universal APK
        shell: bash
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/qamoosi-ai-v3.4.1-clean-universal.apk
          test -s release/qamoosi-ai-v3.4.1-clean-universal.apk
          ls -lh release/qamoosi-ai-v3.4.1-clean-universal.apk

      - name: Upload Universal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qamoosi-ai-v3.4.1-clean-universal-apk
          path: release/qamoosi-ai-v3.4.1-clean-universal.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="qamoosi-ai-v3.4.1-clean"
          FILE="release/qamoosi-ai-v3.4.1-clean-universal.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --target qamoosi-ai-clean-v341 --title "Qamoosi AI v3.4.1 Clean" --notes "Clean-source Universal APK for Qamoosi AI v3.4.1. Built directly from the final source without historical runtime patch chaining."
          fi
