name: Build APK Direct

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "apk/**"
      - "DOWNLOAD_APK.md"

permissions:
  contents: write

concurrency:
  group: build-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: |
          flutter --version
          flutter create --platforms=android --org com.explapp .
          rm -rf test
          flutter pub get

      - name: Install Android SDK 36
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Force Android SDK 36 compatibility
        run: |
          python3 <<'PYFIX'
          from pathlib import Path
          import os, re

          def patch_file(path: Path):
              if not path.exists():
                  return
              text = path.read_text(errors='ignore')
              original = text
              replacements = [
                  (r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36'),
                  (r'compileSdkVersion\s*=\s*flutter\.compileSdkVersion', 'compileSdkVersion = 36'),
                  (r'compileSdkVersion\s+\d+', 'compileSdkVersion 36'),
                  (r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36'),
                  (r'compileSdk\s+flutter\.compileSdkVersion', 'compileSdk 36'),
                  (r'compileSdk\s+\d+', 'compileSdk 36'),
                  (r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36'),
                  (r'compileSdk\s*=\s*\d+', 'compileSdk = 36'),
              ]
              for pattern, replacement in replacements:
                  text = re.sub(pattern, replacement, text)
              if text != original:
                  path.write_text(text)
                  print('patched', path)

          for rel in [
              'android/app/build.gradle',
              'android/app/build.gradle.kts',
              'android/build.gradle',
              'android/build.gradle.kts',
          ]:
              patch_file(Path(rel))

          pub_cache = Path(os.environ.get('PUB_CACHE', str(Path.home()/'.pub-cache')))
          if pub_cache.exists():
              for pattern in ('build.gradle', 'build.gradle.kts'):
                  for file in pub_cache.rglob(pattern):
                      if '/android/' in str(file):
                          patch_file(file)
          PYFIX

      - name: Set Android package and app name
        run: |
          sed -i 's/applicationId = ".*"/applicationId = "com.explapp.qamoosi_school"/' android/app/build.gradle.kts || true
          sed -i 's/applicationId ".*"/applicationId "com.explapp.qamoosi_school"/' android/app/build.gradle || true
          sed -i 's/android:label="[^"]*"/android:label="قاموسي المدرسي"/' android/app/src/main/AndroidManifest.xml || true

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare downloadable APK
        run: |
          mkdir -p apk
          cp build/app/outputs/flutter-apk/app-release.apk apk/qamoosi-school-v2.0.0.apk
          cp build/app/outputs/flutter-apk/app-release.apk apk/qamoosi-school.apk
          cat > DOWNLOAD_APK.md <<'EOF'
          # تحميل تطبيق قاموسي المدرسي للأندرويد

          أحدث نسخة جاهزة للتثبيت:

          `apk/qamoosi-school.apk`

          اسم الإصدار الحالي:

          `apk/qamoosi-school-v2.0.0.apk`
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qamoosi-school-v2.0.0-apk
          path: apk/qamoosi-school-v2.0.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit APK to main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: Build qamoosi school APK v2.0.0
          file_pattern: apk/qamoosi-school.apk apk/qamoosi-school-v2.0.0.apk DOWNLOAD_APK.md
