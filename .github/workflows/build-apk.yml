name: Build APK Direct

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "apk/**"
      - "DOWNLOAD_APK.md"

permissions:
  contents: write

concurrency:
  group: build-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: |
          flutter create --platforms=android --org com.explapp .
          rm -rf test
          flutter pub get

      - name: Apply v2.2.0 sentence import and UI fix
        run: python3 tool/patch_v220_sentences.py

      - name: Configure Android package and TTS
        run: |
          sed -i 's/applicationId = ".*"/applicationId = "com.explapp.qamoosi_school"/' android/app/build.gradle.kts || true
          sed -i 's/android:label="[^"]*"/android:label="قاموسي المدرسي"/' android/app/src/main/AndroidManifest.xml || true
          python3 <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          if 'android.intent.action.TTS_SERVICE' not in text:
              queries = '''\n    <queries>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n    </queries>\n'''
              text = text.replace('<application', queries + '    <application', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare downloadable APK
        run: |
          mkdir -p apk
          cp build/app/outputs/flutter-apk/app-release.apk apk/qamoosi-school.apk
          cp build/app/outputs/flutter-apk/app-release.apk apk/qamoosi-school-v2.2.0.apk
          test -s apk/qamoosi-school-v2.2.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qamoosi-school-v2.2.0-apk
          path: apk/qamoosi-school-v2.2.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit built APK to main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: Build verified qamoosi school APK v2.2.0
          file_pattern: lib/main.dart android apk/qamoosi-school.apk apk/qamoosi-school-v2.2.0.apk
