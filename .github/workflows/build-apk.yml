name: Build APK Direct

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "apk/**"
      - "DOWNLOAD_APK.md"
      - "build_status.txt"
      - "build_analyze.log"
      - "build_apk.log"
  pull_request:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: build-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare and build with captured logs
        shell: bash
        run: |
          set +e
          echo "STARTED" > build_status.txt
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" >> build_apk.log 2>&1 || true
          flutter create --platforms=android --org com.explapp . >> build_apk.log 2>&1
          CREATE_RC=$?
          if [ "$CREATE_RC" -ne 0 ]; then
            echo "CREATE_FAILED:$CREATE_RC" > build_status.txt
          else
            rm -rf test
            flutter pub get >> build_apk.log 2>&1
            PUB_RC=$?
            if [ "$PUB_RC" -ne 0 ]; then
              echo "PUBGET_FAILED:$PUB_RC" > build_status.txt
            else
              python3 tool/patch_v220_sentences.py >> build_apk.log 2>&1
              PATCH_RC=$?
              if [ "$PATCH_RC" -ne 0 ]; then
                echo "PATCH_FAILED:$PATCH_RC" > build_status.txt
              else
                sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts || true
                sed -i 's/applicationId = ".*"/applicationId = "com.explapp.qamoosi_school"/' android/app/build.gradle.kts || true
                sed -i 's/android:label="[^"]*"/android:label="قاموسي المدرسي"/' android/app/src/main/AndroidManifest.xml || true
                flutter analyze --no-fatal-infos --no-fatal-warnings > build_analyze.log 2>&1
                ANALYZE_RC=$?
                if [ "$ANALYZE_RC" -ne 0 ]; then
                  echo "ANALYZE_FAILED:$ANALYZE_RC" > build_status.txt
                else
                  flutter build apk --release >> build_apk.log 2>&1
                  BUILD_RC=$?
                  if [ "$BUILD_RC" -ne 0 ]; then
                    echo "BUILD_FAILED:$BUILD_RC" > build_status.txt
                  else
                    mkdir -p apk
                    cp build/app/outputs/flutter-apk/app-release.apk apk/qamoosi-school.apk
                    cp build/app/outputs/flutter-apk/app-release.apk apk/qamoosi-school-v2.2.0.apk
                    if test -s apk/qamoosi-school-v2.2.0.apk; then
                      echo "SUCCESS" > build_status.txt
                    else
                      echo "APK_MISSING" > build_status.txt
                    fi
                  fi
                fi
              fi
            fi
          fi
          echo "===== BUILD STATUS ====="
          cat build_status.txt
          echo "===== ANALYZE LOG ====="
          cat build_analyze.log 2>/dev/null || true
          echo "===== BUILD LOG (last 250 lines) ====="
          tail -n 250 build_apk.log 2>/dev/null || true
          exit 0

      - name: Upload APK artifact
        if: hashFiles('apk/qamoosi-school-v2.2.0.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: qamoosi-school-v2.2.0-apk
          path: apk/qamoosi-school-v2.2.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit build result to main
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: Record Android v2.2.0 build result
          file_pattern: lib/main.dart android apk build_status.txt

      - name: Verify success
        run: test "$(cat build_status.txt)" = "SUCCESS"
