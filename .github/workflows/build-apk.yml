name: Build APK Direct

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android project
        run: |
          flutter --version
          flutter create --platforms=android --org com.explapp .
          rm -rf test
          flutter pub get

      - name: Force Android SDK 36 compatibility
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
          python3 <<'PYFIX'
          from pathlib import Path
          import os, re

          def patch_file(path: Path):
              if not path.exists():
                  return
              text = path.read_text(errors='ignore')
              original = text
              # Groovy DSL forms
              text = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36', text)
              text = re.sub(r'compileSdkVersion\s*=\s*flutter\.compileSdkVersion', 'compileSdkVersion = 36', text)
              text = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', text)
              text = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', text)
              text = re.sub(r'compileSdk\s+flutter\.compileSdkVersion', 'compileSdk 36', text)
              text = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', text)
              # Kotlin DSL forms
              text = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', text)
              text = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', text)
              if text != original:
                  path.write_text(text)
                  print('patched', path)

          # Patch generated app files.
          for rel in [
              'android/app/build.gradle',
              'android/app/build.gradle.kts',
              'android/build.gradle',
              'android/build.gradle.kts',
          ]:
              patch_file(Path(rel))

          # Force all Android subprojects/plugins to compile with SDK 36.
          root_gradle = Path('android/build.gradle')
          if root_gradle.exists():
              text = root_gradle.read_text(errors='ignore')
              block = '''

          subprojects { subproject ->
              afterEvaluate {
                  if (subproject.hasProperty('android')) {
                      subproject.android.compileSdkVersion 36
                  }
              }
          }
          '''
              if 'subproject.android.compileSdkVersion 36' not in text:
                  root_gradle.write_text(text + block)

          root_gradle_kts = Path('android/build.gradle.kts')
          if root_gradle_kts.exists():
              text = root_gradle_kts.read_text(errors='ignore')
              block = '''

          subprojects {
              afterEvaluate {
                  extensions.findByName("android")?.let { androidExt ->
                      androidExt.javaClass.methods.firstOrNull { it.name == "setCompileSdkVersion" }?.invoke(androidExt, 36)
                  }
              }
          }
          '''
              if 'setCompileSdkVersion' not in text:
                  root_gradle_kts.write_text(text + block)

          # Patch Android plugin projects in Pub cache, especially file_picker and lifecycle.
          pub_cache = Path(os.environ.get('PUB_CACHE', str(Path.home()/'.pub-cache')))
          if pub_cache.exists():
              for pattern in ['android/build.gradle', 'android/build.gradle.kts']:
                  for f in pub_cache.rglob(pattern):
                      patch_file(f)
          PYFIX

      - name: Android package and app name
        run: |
          sed -i "s/applicationId = .*/applicationId = \"com.explapp.qamoosi_school\"/" android/app/build.gradle || true
          sed -i "s/applicationId \".*\"/applicationId \"com.explapp.qamoosi_school\"/" android/app/build.gradle || true
          sed -i 's/android:label="[^"]*"/android:label="قاموسي المدرسي"/' android/app/src/main/AndroidManifest.xml || true

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - name: Copy APK
        run: |
          mkdir -p apk
          cp build/app/outputs/flutter-apk/app-release.apk apk/qamoosi-school.apk
          cat > DOWNLOAD_APK.md <<'EOF'
          # تحميل تطبيق قاموسي المدرسي

          بعد نجاح البناء، رابط APK المباشر داخل المستودع:

          `apk/qamoosi-school.apk`

          أو من GitHub:

          `https://github.com/aljwaal1/dict/raw/main/apk/qamoosi-school.apk`
          EOF

      - name: Commit APK
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Build qamoosi school APK
          file_pattern: apk/qamoosi-school.apk DOWNLOAD_APK.md
