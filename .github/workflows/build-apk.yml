name: Build APK Direct

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "apk/**"
      - "DOWNLOAD_APK.md"
  pull_request:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: |
          flutter create --platforms=android --org com.explapp .
          rm -rf test
          flutter pub get

      - name: Restore content features
        run: python3 tool/patch_content.py

      - name: Improve pronunciation
        run: python3 tool/patch_pronunciation.py

      - name: Add JSON Excel and CSV imports
        run: python3 tool/patch_import_files.py

      - name: Restore robust Excel compatibility
        run: python3 tool/patch_excel_compat.py

      - name: Separate card controls
        run: python3 tool/patch_card_controls.py

      - name: Fix visible version number
        run: python3 tool/patch_version.py

      - name: Remove duplicate pronunciation helper
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('lib/main.dart')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(r'\n  Future<bool> testPronunciation\(\) async \{.*?\n  \}', re.S)
          matches = list(pattern.finditer(text))
          for m in reversed(matches[1:]):
              text = text[:m.start()] + text[m.end():]
          p.write_text(text, encoding='utf-8')
          PY

      - name: Apply final root fixes
        run: python3 tool/run_final_v210.py

      - name: Configure Android and TTS discovery
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
          sed -i 's/applicationId = ".*"/applicationId = "com.explapp.qamoosi_school"/' android/app/build.gradle.kts || true
          sed -i 's/android:label="[^"]*"/android:label="قاموسي المدرسي"/' android/app/src/main/AndroidManifest.xml || true
          python3 <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          if 'android.intent.action.TTS_SERVICE' not in text:
              queries = '''\n    <queries>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n    </queries>\n'''
              text = text.replace('<application', queries + '    <application', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare downloadable APK
        run: |
          mkdir -p apk
          cp build/app/outputs/flutter-apk/app-release.apk apk/qamoosi-school.apk
          cp build/app/outputs/flutter-apk/app-release.apk apk/qamoosi-school-v2.1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qamoosi-school-v2.1.0-apk
          path: apk/qamoosi-school-v2.1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit source and APK to main
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: Build qamoosi school APK v2.1.0 final root fixes
          file_pattern: lib/main.dart apk/qamoosi-school.apk apk/qamoosi-school-v2.1.0.apk
