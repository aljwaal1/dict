name: Build Qamoosi AI v3.4.1

on:
  push:
    branches: ["qamoosi-ai-v340-ux"]
    paths-ignore:
      - "release/*.apk"
      - "apk/*.apk"
      - "qamoosi_ai_build_status.txt"
      - "qamoosi_ai_build_analyze.log"
      - "qamoosi_ai_build_apk.log"
  pull_request:
    branches: ["qamoosi-ai-v340-ux"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qamoosi-ai-v340-build-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout v3.4 branch
        uses: actions/checkout@v4
        with:
          ref: qamoosi-ai-v340-ux
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Qamoosi AI v3.4.1 Universal APK
        shell: bash
        run: |
          set +e
          echo "STARTED" > qamoosi_ai_build_status.txt
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" >> qamoosi_ai_build_apk.log 2>&1 || true
          flutter create --platforms=android --org com.explapp . >> qamoosi_ai_build_apk.log 2>&1
          if [ $? -ne 0 ]; then echo "CREATE_FAILED" > qamoosi_ai_build_status.txt; else
            rm -rf test
            flutter pub get >> qamoosi_ai_build_apk.log 2>&1
            if [ $? -ne 0 ]; then echo "PUBGET_FAILED" > qamoosi_ai_build_status.txt; else
              python3 tool/patch_jordan_v300_redesign.py >> qamoosi_ai_build_apk.log 2>&1; p1=$?
              python3 tool/patch_jordan_v310_booklab.py >> qamoosi_ai_build_apk.log 2>&1; p2=$?
              python3 tool/patch_jordan_v311_pdf_engine.py >> qamoosi_ai_build_apk.log 2>&1; p3=$?
              python3 tool/patch_jordan_v320_auto_meanings.py >> qamoosi_ai_build_apk.log 2>&1; p4=$?
              python3 tool/patch_jordan_v321_clean_extraction.py >> qamoosi_ai_build_apk.log 2>&1; p5=$?
              python3 tool/patch_jordan_v322_examples_translation.py >> qamoosi_ai_build_apk.log 2>&1; p6=$?
              python3 tool/patch_jordan_v323_release.py >> qamoosi_ai_build_apk.log 2>&1; p7=$?
              python3 tool/patch_generator_supplement_v330.py >> qamoosi_ai_build_apk.log 2>&1; ps=$?
              python3 tool/generate_global_ai_words_v330.py >> qamoosi_ai_build_apk.log 2>&1; p8=$?
              python3 tool/patch_global_ai_v330.py >> qamoosi_ai_build_apk.log 2>&1; p9=$?
              python3 tool/improve_examples_v340.py >> qamoosi_ai_build_apk.log 2>&1; p10=$?
              python3 tool/patch_qamoosi_v340_learning_ux.py >> qamoosi_ai_build_apk.log 2>&1; p11=$?
              python3 tool/patch_qamoosi_v341_colored_nav.py >> qamoosi_ai_build_apk.log 2>&1; p12=$?
              if [ $p1 -ne 0 ] || [ $p2 -ne 0 ] || [ $p3 -ne 0 ] || [ $p4 -ne 0 ] || [ $p5 -ne 0 ] || [ $p6 -ne 0 ] || [ $p7 -ne 0 ] || [ $ps -ne 0 ] || [ $p8 -ne 0 ] || [ $p9 -ne 0 ] || [ $p10 -ne 0 ] || [ $p11 -ne 0 ] || [ $p12 -ne 0 ]; then
                echo "PATCH_FAILED" > qamoosi_ai_build_status.txt
              else
                sed -i 's/^version:.*/version: 3.4.1+30/' pubspec.yaml
                sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts || true
                sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts || true
                sed -i 's/applicationId = ".*"/applicationId = "com.explapp.jordan_school_dictionary"/' android/app/build.gradle.kts || true
                sed -i 's/android:label="[^"]*"/android:label="قاموسي AI"/' android/app/src/main/AndroidManifest.xml || true
                flutter pub get >> qamoosi_ai_build_apk.log 2>&1
                flutter analyze --no-fatal-infos --no-fatal-warnings > qamoosi_ai_build_analyze.log 2>&1
                if [ $? -ne 0 ]; then echo "ANALYZE_FAILED" > qamoosi_ai_build_status.txt; else
                  flutter build apk --release >> qamoosi_ai_build_apk.log 2>&1
                  if [ $? -ne 0 ]; then echo "BUILD_FAILED" > qamoosi_ai_build_status.txt; else
                    mkdir -p release
                    cp build/app/outputs/flutter-apk/app-release.apk release/qamoosi-ai-v3.4.1-universal.apk
                    if test -s release/qamoosi-ai-v3.4.1-universal.apk; then echo "SUCCESS" > qamoosi_ai_build_status.txt; else echo "APK_MISSING" > qamoosi_ai_build_status.txt; fi
                  fi
                fi
              fi
            fi
          fi
          cat qamoosi_ai_build_status.txt
          ls -lh release/*.apk 2>/dev/null || true
          tail -n 180 qamoosi_ai_build_analyze.log 2>/dev/null || true
          tail -n 240 qamoosi_ai_build_apk.log 2>/dev/null || true
          exit 0

      - name: Upload Universal APK artifact
        if: hashFiles('release/qamoosi-ai-v3.4.1-universal.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: qamoosi-ai-v3.4.1-universal-apk
          path: release/qamoosi-ai-v3.4.1-universal.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Universal APK to GitHub Release
        if: github.event_name != 'pull_request' && hashFiles('release/qamoosi-ai-v3.4.1-universal.apk') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="qamoosi-ai-v3.4.1"
          FILE="release/qamoosi-ai-v3.4.1-universal.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --target qamoosi-ai-v340-ux --title "Qamoosi AI v3.4.1" --notes "قاموسي AI v3.4.1: كل قسم في شريط التنقل السفلي أصبح بلون مميز وواضح، مع أيقونة نشطة بارزة وخلفية ملونة وظل خفيف، بالإضافة إلى جميع تحسينات v3.4 السابقة للبطاقات والاختبارات والأمثلة والنطق."
          fi

      - name: Persist generated source and logs
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart assets/data/words.json android qamoosi_ai_build_status.txt qamoosi_ai_build_analyze.log qamoosi_ai_build_apk.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Record Qamoosi AI v3.4.1 colored navigation build"
            git pull --rebase origin qamoosi-ai-v340-ux || true
            git push origin HEAD:qamoosi-ai-v340-ux
          fi

      - name: Verify success
        run: test "$(cat qamoosi_ai_build_status.txt)" = "SUCCESS"
