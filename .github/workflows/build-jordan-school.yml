name: Build Jordan School Dictionary

on:
  push:
    branches: ["jordan-school-dictionary"]
    paths-ignore:
      - "apk/jordan-school-dictionary*.apk"
      - "jordan_build_status.txt"
      - "jordan_build_analyze.log"
      - "jordan_build_apk.log"
  pull_request:
    branches: ["jordan-school-dictionary"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jordan-school-dictionary-build
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Jordan branch
        uses: actions/checkout@v4
        with:
          ref: jordan-school-dictionary
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Jordan Android v3.2.3 split APKs
        shell: bash
        run: |
          set +e
          echo "STARTED" > jordan_build_status.txt
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" >> jordan_build_apk.log 2>&1 || true
          flutter create --platforms=android --org com.explapp . >> jordan_build_apk.log 2>&1
          if [ $? -ne 0 ]; then echo "CREATE_FAILED" > jordan_build_status.txt; else
            rm -rf test
            flutter pub get >> jordan_build_apk.log 2>&1
            if [ $? -ne 0 ]; then echo "PUBGET_FAILED" > jordan_build_status.txt; else
              python3 tool/patch_jordan_v300_redesign.py >> jordan_build_apk.log 2>&1; p1=$?
              python3 tool/patch_jordan_v310_booklab.py >> jordan_build_apk.log 2>&1; p2=$?
              python3 tool/patch_jordan_v311_pdf_engine.py >> jordan_build_apk.log 2>&1; p3=$?
              python3 tool/patch_jordan_v320_auto_meanings.py >> jordan_build_apk.log 2>&1; p4=$?
              python3 tool/patch_jordan_v321_clean_extraction.py >> jordan_build_apk.log 2>&1; p5=$?
              python3 tool/patch_jordan_v322_examples_translation.py >> jordan_build_apk.log 2>&1; p6=$?
              python3 tool/patch_jordan_v323_release.py >> jordan_build_apk.log 2>&1; p7=$?
              if [ $p1 -ne 0 ] || [ $p2 -ne 0 ] || [ $p3 -ne 0 ] || [ $p4 -ne 0 ] || [ $p5 -ne 0 ] || [ $p6 -ne 0 ] || [ $p7 -ne 0 ]; then
                echo "PATCH_FAILED" > jordan_build_status.txt
              else
                sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts || true
                sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts || true
                sed -i 's/applicationId = ".*"/applicationId = "com.explapp.jordan_school_dictionary"/' android/app/build.gradle.kts || true
                sed -i 's/android:label="[^"]*"/android:label="القاموس المدرسي الأردني"/' android/app/src/main/AndroidManifest.xml || true
                flutter analyze --no-fatal-infos --no-fatal-warnings > jordan_build_analyze.log 2>&1
                if [ $? -ne 0 ]; then echo "ANALYZE_FAILED" > jordan_build_status.txt; else
                  flutter build apk --release --split-per-abi >> jordan_build_apk.log 2>&1
                  if [ $? -ne 0 ]; then echo "BUILD_FAILED" > jordan_build_status.txt; else
                    mkdir -p apk
                    cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk apk/jordan-school-dictionary-v3.2.3-arm64-v8a.apk
                    cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk apk/jordan-school-dictionary-v3.2.3-armeabi-v7a.apk
                    cp build/app/outputs/flutter-apk/app-x86_64-release.apk apk/jordan-school-dictionary-v3.2.3-x86_64.apk
                    cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk apk/jordan-school-dictionary.apk
                    if test -s apk/jordan-school-dictionary-v3.2.3-arm64-v8a.apk; then echo "SUCCESS" > jordan_build_status.txt; else echo "APK_MISSING" > jordan_build_status.txt; fi
                  fi
                fi
              fi
            fi
          fi
          cat jordan_build_status.txt
          ls -lh apk/*.apk 2>/dev/null || true
          tail -n 200 jordan_build_analyze.log 2>/dev/null || true
          tail -n 250 jordan_build_apk.log 2>/dev/null || true
          exit 0

      - name: Upload Jordan APKs
        if: hashFiles('apk/jordan-school-dictionary-v3.2.3-arm64-v8a.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: jordan-school-dictionary-v3.2.3-split-apks
          path: |
            apk/jordan-school-dictionary-v3.2.3-arm64-v8a.apk
            apk/jordan-school-dictionary-v3.2.3-armeabi-v7a.apk
            apk/jordan-school-dictionary-v3.2.3-x86_64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Persist generated app and APKs on Jordan branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart android apk jordan_build_status.txt jordan_build_analyze.log jordan_build_apk.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Record Jordan School Dictionary v3.2.3 split APK build"
            git pull --rebase origin jordan-school-dictionary || true
            git push origin HEAD:jordan-school-dictionary
          fi

      - name: Verify success
        run: test "$(cat jordan_build_status.txt)" = "SUCCESS"
