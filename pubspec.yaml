name: qamoosi_school
description: Easy English AI - تعلم الإنجليزية بسهولة بالكلمات والجمل والنطق والتعلم الذكي من PDF.
publish_to: 'none'
version: 3.4.4+33

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_tts: ^4.0.2
  google_mlkit_translation: ^0.14.0
  http: ^1.2.2
  url_launcher: ^6.3.0
  file_picker: ^10.3.3
  archive: ^4.0.9
  xml: ^7.0.1
  share_plus: ^10.1.2
  path_provider: ^2.1.5
  pdfrx: ^2.4.7
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/words.json
